name: chms-dev

services:
  redis:
    image: redis:7-alpine
    container_name: chms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: chms-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  meili-data:
